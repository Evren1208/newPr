name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ClassTeacherToolbox --collect-all pptx --collect-all docx main.py

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/config | Out-Null
          Copy-Item config/ai.example.json dist/config/ai.example.json

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          $candidates = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe not found after NSIS installation.' }
          Push-Location installer
          & $makensis 'ClassTeacherToolbox.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ClassTeacherToolbox-Windows-V0.2
          path: |
            installer-output/ClassTeacherToolbox-Setup-V0.2.exe
            dist/ClassTeacherToolbox.exe
            dist/config/ai.example.json
          if-no-files-found: error
